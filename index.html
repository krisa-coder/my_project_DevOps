<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemeHub — мемы сообщества</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <h1 class="logo">🎭 MemeHub</h1>
        <div class="auth-block" id="authBlock">
            <span id="userInfo" class="user-info"></span>
            <button id="authBtn" class="btn">Войти</button>
            <button id="logoutBtn" class="btn btn-secondary" style="display:none">Выйти</button>
        </div>
    </header>

    <main class="container">
        <!-- Форма создания мема -->
        <section class="create-meme">
            <h2>Создать мем</h2>
            <form id="memeForm">
                <input type="text" id="memeTitle" placeholder="Название мема" required>
                <input type="url" id="memeImage" placeholder="URL картинки" required>
                <textarea id="memeCaption" placeholder="Подпись (сверху)" rows="1"></textarea>
                <button type="submit" class="btn">Опубликовать</button>
            </form>
        </section>

        <!-- Лента мемов -->
        <section class="feed" id="feed"></section>
    </main>

    <!-- Модальное окно авторизации -->
    <div id="authModal" class="modal hidden">
        <div class="modal-content">
            <h3 id="authTitle">Вход</h3>
            <form id="authForm">
                <input type="text" id="authUsername" placeholder="Логин" required>
                <input type="password" id="authPassword" placeholder="Пароль" required>
                <div class="modal-actions">
                    <button type="submit" class="btn">OK</button>
                    <button type="button" id="toggleAuthMode" class="btn btn-secondary">Регистрация</button>
                    <button type="button" id="closeModal" class="btn btn-secondary">Закрыть</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
